server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/skatecross
    # url: jdbc:postgresql://localhost:5433/skatecross
    username: skatecross
    password: skatecross_dev_only
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true

# ============================================
# SWAGGER / OPENAPI CONFIGURATION
# ============================================

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
